<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>멘토 페이지 - 영어 멘토멘티 시험</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <a class="top-link" href="index.html">← 시험 페이지로</a>
  <h1>멘토 페이지</h1>

  <!-- 잠금 화면 -->
  <div id="lockScreen" class="card">
    <div class="field">
      <label for="pwInput">비밀번호</label>
      <input type="password" id="pwInput" placeholder="비밀번호를 입력하세요" />
    </div>
    <button id="unlockBtn">입장</button>
    <div id="lockError" class="error-msg hidden"></div>
  </div>

  <!-- 메뉴 화면 -->
  <div id="menuScreen" class="menu-screen hidden">
    <button class="menu-btn" id="goRegisterBtn">시험 문제 등록</button>
    <button class="menu-btn secondary" id="goResultsBtn">시험지 확인</button>
  </div>

  <!-- 시험 문제 등록 화면 -->
  <div id="registerScreen" class="hidden">
    <button class="back-btn" id="backFromRegisterBtn">← 메뉴로</button>
    <div class="card">
      <h2>새 시험지 등록</h2>
      <div class="field">
        <label for="examName">시험지 이름</label>
        <input type="text" id="examName" placeholder="예: 1차 단어 시험" />
      </div>
      <div class="field">
        <label for="bulkQuestions">문제</label>
        <textarea id="bulkQuestions" rows="12" placeholder="사과를 영어로 쓰시오.&#10;apple&#10;&#10;바나나를 영어로 쓰시오.&#10;banana|Banana"></textarea>
        <div class="muted" style="margin-top:6px;">
          문제와 문제 사이는 빈 줄로 구분하세요. 각 문제 블록의 마지막 줄이 정답, 그 위 줄들이 문제입니다. 정답을 여러 개 인정하려면 |로 구분하세요. (예: apple|Apple)
        </div>
      </div>
      <button id="submitExamBtn">등록</button>
      <div id="registerError" class="error-msg hidden"></div>
      <div id="registerSuccess" class="muted hidden"></div>
    </div>

    <div class="card">
      <h2>등록된 시험지 목록</h2>
      <div id="examListMentor" class="muted">불러오는 중...</div>
    </div>
  </div>

  <!-- 시험지 확인: 응시자 목록 -->
  <div id="resultsListScreen" class="hidden">
    <button class="back-btn" id="backFromResultsBtn">← 메뉴로</button>
    <div class="card">
      <div class="row" style="justify-content: space-between; align-items:center;">
        <h2 style="margin:0;">시험 응시자 목록</h2>
        <button class="secondary" id="refreshStudentsBtn">새로고침</button>
      </div>
      <div id="studentListMentor" class="muted">불러오는 중...</div>
    </div>
  </div>

  <!-- 학생이 본 시험지 목록 -->
  <div id="studentExamsScreen" class="hidden">
    <button class="back-btn" id="backFromStudentExamsBtn">← 목록으로</button>
    <div class="card">
      <h2 id="studentExamsTitle"></h2>
      <div id="studentExamsList" class="muted">불러오는 중...</div>
    </div>
  </div>

  <!-- 시험지 답안 상세 -->
  <div id="examDetailScreen" class="hidden">
    <button class="back-btn" id="backFromExamDetailBtn">← 목록으로</button>
    <div class="card">
      <h2 id="examDetailTitle"></h2>
      <div id="examDetailContent" class="muted">불러오는 중...</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="mentor.js"></script>
</body>
</html>

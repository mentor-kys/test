<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>멘토 페이지 - 영어 멘토멘티 시험</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <a class="top-link" href="index.html">← 시험 페이지로</a>
  <h1>멘토 페이지</h1>
  <hr class="page-divider" />

  <!-- 잠금 화면 -->
  <div id="lockScreen" class="card">
    <div class="field">
      <label for="pwInput">비밀번호</label>
      <input type="password" id="pwInput" placeholder="비밀번호를 입력하세요" />
    </div>
    <button id="unlockBtn">입장</button>
    <div id="lockError" class="error-msg hidden"></div>
  </div>

  <!-- 메뉴 화면 -->
  <div id="menuScreen" class="menu-screen hidden">
    <button class="menu-btn" id="goRegisterBtn">시험 문제 등록</button>
    <button class="menu-btn secondary" id="goResultsBtn">시험지 확인</button>
    <button class="menu-btn secondary" id="goManageBtn">시험지 관리</button>
    <button class="menu-btn secondary" id="goChartBtn">성적 그래프</button>
  </div>

  <!-- 시험 문제 등록 화면 -->
  <div id="registerScreen" class="hidden">
    <button class="back-btn" id="backFromRegisterBtn">← 메뉴로</button>
    <div class="card">
      <h2>새 시험지 등록</h2>
      <div class="field">
        <label for="examName">시험지 이름</label>
        <input type="text" id="examName" placeholder="예: 1차 단어 시험" />
      </div>
      <div class="field">
        <label for="bulkQuestions">문제</label>
        <textarea id="bulkQuestions" rows="12" placeholder="사과를 영어로 쓰시오.&#10;&#10;바나나를 영어로 쓰시오."></textarea>
        <div class="muted" style="margin-top:6px;">
          문제와 문제 사이는 빈 줄로 구분하세요. 정답은 따로 입력하지 않습니다 (채점은 멘토가 직접 확인).
        </div>
      </div>
      <button id="submitExamBtn">등록</button>
      <div id="registerError" class="error-msg hidden"></div>
      <div id="registerSuccess" class="muted hidden"></div>
    </div>

    <div class="card">
      <h2>등록된 시험지 목록</h2>
      <div id="examListMentor" class="muted">불러오는 중...</div>
    </div>
  </div>

  <!-- 시험지 확인: 응시자 목록 -->
  <div id="resultsListScreen" class="hidden">
    <button class="back-btn" id="backFromResultsBtn">← 메뉴로</button>
    <div class="card">
      <div class="row" style="justify-content: space-between; align-items:center;">
        <h2 style="margin:0;">시험 응시자 목록</h2>
        <button class="secondary" id="refreshStudentsBtn">새로고침</button>
      </div>
      <div id="studentListMentor" class="muted">불러오는 중...</div>
    </div>
  </div>

  <!-- 학생이 본 시험지 목록 -->
  <div id="studentExamsScreen" class="hidden">
    <button class="back-btn" id="backFromStudentExamsBtn">← 목록으로</button>
    <div class="card">
      <h2 id="studentExamsTitle"></h2>
      <div id="studentExamsList" class="muted">불러오는 중...</div>
    </div>
  </div>

  <!-- 시험지 답안 상세 -->
  <div id="examDetailScreen" class="hidden">
    <button class="back-btn" id="backFromExamDetailBtn">← 목록으로</button>
    <div class="card">
      <h2 id="examDetailTitle"></h2>
      <div id="examDetailContent" class="muted">불러오는 중...</div>
    </div>
  </div>

  <!-- 시험지 관리 -->
  <div id="manageScreen" class="hidden">
    <button class="back-btn" id="backFromManageBtn">← 메뉴로</button>
    <div class="card">
      <div class="row" style="justify-content: space-between; align-items:center;">
        <h2 style="margin:0;">시험지 관리</h2>
        <button class="secondary" id="refreshManageBtn">새로고침</button>
      </div>
      <div id="manageListMentor" class="muted">불러오는 중...</div>
    </div>
  </div>

  <!-- 시험지 문제 수정 -->
  <div id="editExamScreen" class="hidden">
    <button class="back-btn" id="backFromEditExamBtn">← 목록으로</button>
    <div class="card">
      <h2>시험지 수정</h2>
      <div class="field">
        <label for="editExamName">시험지 이름</label>
        <input type="text" id="editExamName" placeholder="예: 1차 단어 시험" />
      </div>
      <div class="field">
        <label for="editBulkQuestions">문제</label>
        <textarea id="editBulkQuestions" rows="12"></textarea>
        <div class="muted" style="margin-top:6px;">
          문제와 문제 사이는 빈 줄로 구분하세요. 저장하면 기존 문제는 모두 이 내용으로 교체됩니다.
        </div>
      </div>
      <button id="saveEditExamBtn">저장</button>
      <div id="editExamError" class="error-msg hidden"></div>
      <div id="editExamSuccess" class="muted hidden"></div>
    </div>
  </div>

  <!-- 성적 그래프: 목록 -->
  <div id="chartScreen" class="hidden">
    <button class="back-btn" id="backFromChartBtn">← 메뉴로</button>
    <div class="card">
      <div class="row" style="justify-content: space-between; align-items:center;">
        <h2 style="margin:0;">성적 그래프</h2>
        <button class="secondary" id="refreshChartBtn">새로고침</button>
      </div>
      <div class="muted" style="margin-bottom:12px;">채점이 하나라도 된 시험만 집계됩니다.</div>
      <div id="chartListMentor" class="muted">불러오는 중...</div>
    </div>
  </div>

  <!-- 성적 그래프: 상세 -->
  <div id="chartDetailScreen" class="hidden">
    <button class="back-btn" id="backFromChartDetailBtn">← 목록으로</button>
    <div class="card">
      <h2 id="chartDetailTitle"></h2>
      <div class="chart-wrap">
        <canvas id="scoreChart"></canvas>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="config.js"></script>
<script src="mentor.js"></script>
</body>
</html>
